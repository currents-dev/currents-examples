<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Northwind Supply</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <header class="topbar">
      <span class="brand">Northwind Supply</span>
      <span class="step">Sign in</span>
    </header>

    <main class="login">
      <section class="login-card" aria-labelledby="login-heading">
        <h1 id="login-heading">Sign in to Northwind</h1>
        <p id="form-status" class="form-status" role="alert"></p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              aria-describedby="email-error"
            />
            <p id="email-error" class="field-error"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-row">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                aria-describedby="password-error"
              />
              <button
                id="toggle-password"
                class="toggle"
                type="button"
                aria-controls="password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <p id="password-error" class="field-error"></p>
          </div>

          <div class="options">
            <label class="remember">
              <input id="remember" name="remember" type="checkbox" />
              Remember me
            </label>
            <a class="forgot" href="#">Forgot password?</a>
          </div>

          <button id="sign-in" class="sign-in" type="submit">Sign in</button>
        </form>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>

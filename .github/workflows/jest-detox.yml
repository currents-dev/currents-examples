name: Jest + Detox

on:
  push:
    branches: [main]
    paths:
      ["generic-reporter/jest/detox/**", ".github/workflows/jest-detox.yml"]
  pull_request:
    paths:
      ["generic-reporter/jest/detox/**", ".github/workflows/jest-detox.yml"]
  workflow_dispatch:

jobs:
  android:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: generic-reporter/jest/detox
    env:
      CURRENTS_PROJECT_ID: X7niCl
      HAS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY != '' }}
      CURRENTS_CI_BUILD_ID: ${{ github.repository }}-detox-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: generic-reporter/jest/detox/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Build the app
        run: npx detox build --configuration android.att.release

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: generic-reporter/jest/detox
          script: npx detox test --configuration android.att.release --retries 1 --headless

      # Runs after `detox test` exits, when Detox has finished writing the
      # videos and logs.
      - name: Upload the results to Currents
        # Pull requests from forks get no secrets and skip the upload.
        if: ${{ !cancelled() && env.HAS_RECORD_KEY == 'true' }}
        env:
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
        run: npx currents upload

      - name: Keep the Detox artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: detox-artifacts
          path: generic-reporter/jest/detox/artifacts

name: Jest + Detox

on:
  push:
    branches: [main]
    paths:
      ["generic-reporter/jest/detox/**", ".github/workflows/jest-detox.yml"]
  pull_request:
    paths:
      ["generic-reporter/jest/detox/**", ".github/workflows/jest-detox.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: generic-reporter/jest/detox
    env:
      CURRENTS_PROJECT_ID: X7niCl
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      CURRENTS_CI_BUILD_ID: ${{ github.repository }}-detox-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: generic-reporter/jest/detox/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Build the app
        run: npx detox build --configuration android.att.release

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: generic-reporter/jest/detox
          script: npx detox test --configuration android.att.release --retries 1 --headless

      # A pull_request run checks out a merge commit GitHub creates, so without
      # this step Currents shows "Merge <sha> into <sha>" as the commit message.
      # `currents upload` reads the COMMIT_INFO_* variables before git.
      - name: Use the pull request commit for Currents
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch --depth=1 origin "$HEAD_SHA"
          # A random delimiter: a commit message line equal to a fixed one would end the
          # value early and add the lines after it as variables.
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "COMMIT_INFO_SHA=$HEAD_SHA"
            echo "COMMIT_INFO_BRANCH=$HEAD_REF"
            echo "COMMIT_INFO_AUTHOR=$(git log -1 --format=%an "$HEAD_SHA")"
            echo "COMMIT_INFO_EMAIL=$(git log -1 --format=%ae "$HEAD_SHA")"
            echo "COMMIT_INFO_MESSAGE<<$delimiter"
            git log -1 --format=%B "$HEAD_SHA"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      # Runs after `detox test` exits, when Detox has finished writing the
      # videos and logs.
      - name: Upload the results to Currents
        if: ${{ !cancelled() && env.CURRENTS_RECORD_KEY != '' }}
        run: npx currents upload

      - name: Keep the Detox artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: detox-artifacts
          path: generic-reporter/jest/detox/artifacts
